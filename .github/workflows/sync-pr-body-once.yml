name: sync pr body once

on:
  push:
    branches:
      - cursor/upstream-cursor-provider-5b2d
      - cursor/upstream-cursor-provider-dev-627e

permissions:
  pull-requests: write
  contents: read

jobs:
  sync-pr-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (!prs.length) {
              core.info(`No open PR for branch ${branch}`);
              return;
            }
            const body = fs.readFileSync('.github/pr-body-sync.md', 'utf8');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prs[0].number,
              body,
            });
            core.info(`Updated PR #${prs[0].number} body for ${branch}`);
