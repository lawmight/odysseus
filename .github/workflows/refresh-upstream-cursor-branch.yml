# Daily (and on-demand) refresh of lawmight upstream-facing Cursor SDK branches.
# Merges pewdiepie-archdaemon/odysseus into cursor/upstream-cursor-provider-* only.
# Never merges fork main. Never carves. See docs/cloud/UPSTREAM_CURSOR_BRANCH.md.
name: Refresh upstream Cursor branch

on:
  schedule:
    # Daily 08:00 UTC — deterministic no-op when already up to date.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: refresh (${{ matrix.target }})
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-upstream-cursor-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: [main, dev]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          # Default GITHUB_TOKEN with contents: write can push to unprotected
          # same-repo branches. If cursor/upstream-cursor-provider-* are
          # protected, add a PAT (repo write) as a secret and set:
          #   token: ${{ secrets.UPSTREAM_CURSOR_REFRESH_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/pewdiepie-archdaemon/odysseus.git
          else
            git remote add upstream https://github.com/pewdiepie-archdaemon/odysseus.git
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cursor.txt

      - name: Create venv and install deps
        run: |
          python -m venv venv
          # shellcheck disable=SC1091
          source venv/bin/activate
          python -m pip install -U pip wheel
          python -m pip install -r requirements.txt -r requirements-cursor.txt

      - name: Refresh cursor branch for upstream ${{ matrix.target }}
        # Exit 0 (incl. "no new commits") → success.
        # Exit 2 (conflicts) / exit 3 (conformance) → fail the job for humans.
        # Other non-zero exits also fail (missing branch, dirty tree, etc.).
        run: bash scripts/refresh-upstream-cursor-branch.sh --target ${{ matrix.target }}
